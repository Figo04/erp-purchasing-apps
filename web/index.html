<!DOCTYPE html>
<html>
<head>
  <!-- 
    Base href harus disesuaikan dengan lokasi hosting kamu.
    Misal kalau app kamu di https://example.com/app/, ubah jadi <base href="/app/">
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ERP Purchasing Apps - Flutter Web">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ERP Purchasing Apps">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ERP Purchasing Apps</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Opsional: bisa tambahkan style loading page */
    body {
      margin: 0;
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="loading">🚀 Loading ERP Purchasing App...</div>

  <!-- 🧩 PATCH: Ignore harmless offsetX error dari Flutter web engine -->
  <script>
    window.addEventListener('error', function (e) {
      if (e.message && e.message.includes('offsetX')) {
        console.warn('⚠️ Ignoring harmless offsetX error from Flutter web engine.');
        e.preventDefault();
        return false;
      }
    });
  </script>

  <!-- Flutter Web bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
